services:
  cmsingbox:
    image: darkver8/cmsingbox:latest
    container_name: cmsingbox-fnos
    restart: unless-stopped
    privileged: true
    environment:
      TZ: Asia/Shanghai
    volumes:
      - "${TRIM_PKGVAR}/data:/data"
    # fnOS FPK 由生命周期脚本自动选择或创建 macvlan 网络。
    # 此文件仅保留为源码构建参考，不由应用中心直接启动。
